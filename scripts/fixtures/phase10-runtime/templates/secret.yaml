apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.runtimeSecret.name }}
  labels:
    app.kubernetes.io/name: phase10-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.runtimeSecret.databaseName | quote }}
  POSTGRES_USER: {{ .Values.runtimeSecret.databaseUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.runtimeSecret.databasePassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.runtimeSecret.databaseUser .Values.runtimeSecret.databasePassword .Release.Name .Values.runtimeSecret.databaseName | quote }}
  JWT_ACCESS_TOKEN_SECRET: {{ .Values.runtimeSecret.jwtAccessTokenSecret | quote }}
  JWT_REFRESH_TOKEN_SECRET: {{ .Values.runtimeSecret.jwtRefreshTokenSecret | quote }}
  INTERNAL_SERVICE_TOKEN: {{ .Values.runtimeSecret.internalServiceToken | quote }}
