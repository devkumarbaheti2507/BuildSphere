apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "buildsphere-personal-prerequisites.fullname" . }}
  labels:
    {{- include "buildsphere-personal-prerequisites.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "buildsphere-personal-prerequisites.fullname" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "buildsphere-personal-prerequisites.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildsphere-personal-prerequisites.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: buildsphere
    spec:
      serviceAccountName: {{ include "buildsphere-personal-prerequisites.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ include "buildsphere-personal-prerequisites.image" . | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: {{ .Values.postgresql.probes.startupFailureThreshold }}
            periodSeconds: {{ .Values.postgresql.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.probes.timeoutSeconds }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.postgresql.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.probes.timeoutSeconds }}
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 20
            timeoutSeconds: {{ .Values.postgresql.probes.timeoutSeconds }}
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "buildsphere-personal-prerequisites.commonLabels" . | nindent 10 }}
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - {{ .Values.postgresql.persistence.accessMode }}
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
