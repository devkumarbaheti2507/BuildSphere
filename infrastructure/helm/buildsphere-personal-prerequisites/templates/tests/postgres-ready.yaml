apiVersion: v1
kind: Pod
metadata:
  name: {{ include "buildsphere-personal-prerequisites.fullname" . }}-test
  labels:
    {{- include "buildsphere-personal-prerequisites.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: prerequisite-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "buildsphere-personal-prerequisites.fullname" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres-ready
      image: {{ include "buildsphere-personal-prerequisites.image" . | quote }}
      imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
      command:
        - /bin/sh
        - -ec
      args:
        - exec psql -h {{ include "buildsphere-personal-prerequisites.fullname" . }} -p {{ .Values.postgresql.service.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: POSTGRES_PASSWORD
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
