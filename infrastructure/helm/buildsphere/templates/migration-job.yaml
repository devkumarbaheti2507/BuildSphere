apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "buildsphere.fullname" . }}-migrate
  labels:
    {{- include "buildsphere.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "buildsphere.selectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "buildsphere.componentName" (dict "root" . "component" "migration") }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "buildsphere.image" (dict "root" . "component" "auth-service") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - node_modules/@buildsphere/service-core/dist/migrate.js
          envFrom:
            - secretRef:
                name: {{ .Values.runtime.existingSecret }}
          resources:
            {{- toYaml .Values.resources.migration | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
