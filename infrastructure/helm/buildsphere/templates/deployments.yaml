{{- $services := (include "buildsphere.backendServices" . | fromYaml).services -}}
{{- range $service := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildsphere.componentName" (dict "root" $ "component" $service.name) }}
  labels:
    {{- include "buildsphere.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  {{- if not $.Values.availability.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: {{ $.Values.availability.rollout.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $.Values.availability.rollout.maxUnavailable }}
      maxSurge: {{ $.Values.availability.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "buildsphere.selectorLabels" (dict "root" $ "component" $service.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildsphere.selectorLabels" (dict "root" $ "component" $service.name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "buildsphere.componentName" (dict "root" $ "component" $service.name) }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.availability.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $.Values.availability.topologySpread.maxSkew }}
          topologyKey: {{ $.Values.availability.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "buildsphere.selectorLabels" (dict "root" $ "component" $service.name) | nindent 14 }}
      {{- end }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: {{ include "buildsphere.image" (dict "root" $ "component" $service.name) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ $service.name | quote }}
            - name: PORT
              value: {{ $service.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "buildsphere.fullname" $ }}-config
            - secretRef:
                name: {{ $.Values.runtime.existingSecret }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml $.Values.resources.backend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildsphere.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "buildsphere.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.availability.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: {{ .Values.availability.rollout.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.availability.rollout.maxUnavailable }}
      maxSurge: {{ .Values.availability.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "buildsphere.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildsphere.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "buildsphere.componentName" (dict "root" . "component" "frontend") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.availability.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.availability.topologySpread.maxSkew }}
          topologyKey: {{ .Values.availability.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "buildsphere.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "buildsphere.image" (dict "root" . "component" "frontend") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
