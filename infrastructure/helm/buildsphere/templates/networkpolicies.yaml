{{- if .Values.networkPolicy.enabled -}}
{{- $components := (include "buildsphere.applicationComponents" . | fromYaml).components -}}
{{- range $component := $components }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "buildsphere.componentName" (dict "root" $ "component" $component.name) }}
  labels:
    {{- include "buildsphere.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  podSelector:
    matchLabels:
      {{- include "buildsphere.selectorLabels" (dict "root" $ "component" $component.name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "buildsphere.selectorLabels" (dict "root" $ "component" "chart-test") | nindent 14 }}
        {{- range $caller := $component.callers }}
        - podSelector:
            matchLabels:
              {{- include "buildsphere.selectorLabels" (dict "root" $ "component" $caller) | nindent 14 }}
        {{- end }}
        {{- if and $component.public $.Values.networkPolicy.ingressController.enabled }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.ingressController.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.ingressController.podSelector.matchLabels | nindent 14 }}
        {{- end }}
        {{- if and $component.metrics $.Values.networkPolicy.metricsCollector.enabled }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.metricsCollector.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.metricsCollector.podSelector.matchLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $component.port }}
{{- end }}
{{- end }}
