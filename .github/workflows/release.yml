name: BuildSphere Release Certification

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      repository_prefix: ${{ steps.metadata.outputs.repository_prefix }}
      version: ${{ steps.metadata.outputs.version }}
      workflow_identity: ${{ steps.metadata.outputs.workflow_identity }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require a default-branch semantic version tag
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          node scripts/create-release-evidence.mjs metadata \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

  build-images:
    name: Build, scan, and sign ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU for ARM64 builds
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88 # v4.1.0
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Install checksum-pinned Trivy
        run: |
          sh scripts/install-trivy.sh "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}/trivy" >> "${GITHUB_PATH}"

      - name: Build and push backend image
        id: build_backend
        if: matrix.type == 'backend'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}:sha-${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.component }}
            SERVICE_PORT=${{ matrix.port }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_LICENSES=MIT
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

      - name: Build and push frontend image
        id: build_frontend
        if: matrix.type == 'frontend'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_LICENSES=MIT
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

      - name: Scan both immutable platforms and create CycloneDX SBOMs
        env:
          IMAGE_DIGEST: ${{ steps.build_backend.outputs.digest || steps.build_frontend.outputs.digest }}
          IMAGE_REPOSITORY: ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}
        run: |
          image_reference="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          mkdir -p "dist/component/sbom" "dist/component/records"
          scan_platform() {
            platform="$1"
            architecture="$2"
            trivy image \
              --platform "${platform}" \
              --no-progress \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed=false \
              --exit-code 1 \
              "${image_reference}"
            trivy image \
              --platform "${platform}" \
              --quiet \
              --no-progress \
              --format cyclonedx \
              --output "dist/component/sbom/${{ matrix.component }}-linux-${architecture}.cdx.json" \
              "${image_reference}"
          }
          scan_platform linux/amd64 amd64
          scan_platform linux/arm64 arm64

      - name: Sign immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build_backend.outputs.digest || steps.build_frontend.outputs.digest }}
          IMAGE_REPOSITORY: ${{ needs.prepare.outputs.repository_prefix }}/${{ matrix.component }}
        run: |
          cosign sign --yes \
            --annotations "buildsphere.version=${{ needs.prepare.outputs.version }}" \
            --annotations "buildsphere.commit=${GITHUB_SHA}" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Write validated component evidence
        env:
          IMAGE_DIGEST: ${{ steps.build_backend.outputs.digest || steps.build_frontend.outputs.digest }}
        run: |
          node scripts/create-release-evidence.mjs component \
            --component "${{ matrix.component }}" \
            --repository-prefix "${{ needs.prepare.outputs.repository_prefix }}" \
            --digest "${IMAGE_DIGEST}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${GITHUB_SHA}" \
            --sbom-amd64 "dist/component/sbom/${{ matrix.component }}-linux-amd64.cdx.json" \
            --sbom-arm64 "dist/component/sbom/${{ matrix.component }}-linux-arm64.cdx.json" \
            --output "dist/component/records/${{ matrix.component }}.json"

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-component-${{ matrix.component }}
          path: dist/component
          if-no-files-found: error
          retention-days: 14

  certify:
    name: Certify draft release
    needs:
      - prepare
      - build-images
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download component evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-component-*
          path: dist/components
          merge-multiple: true

      - name: Package chart and assemble release evidence
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist/release
          helm package infrastructure/helm/buildsphere \
            --version "${RELEASE_VERSION}" \
            --app-version "${RELEASE_VERSION}" \
            --destination dist/release
          node scripts/create-release-evidence.mjs bundle \
            --input-dir dist/components \
            --chart "dist/release/buildsphere-${RELEASE_VERSION}.tgz" \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --repository-prefix "${{ needs.prepare.outputs.repository_prefix }}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-ref "${GITHUB_REF}" \
            --workflow-identity "${{ needs.prepare.outputs.workflow_identity }}" \
            --output-dir dist/release

      - name: Verify every image signature
        env:
          WORKFLOW_IDENTITY: ${{ needs.prepare.outputs.workflow_identity }}
        run: |
          node scripts/create-release-evidence.mjs references \
            --manifest dist/release/buildsphere-release-manifest.json \
            > dist/image-references.txt
          while IFS= read -r image_reference; do
            cosign verify \
              --certificate-identity "${WORKFLOW_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image_reference}"
          done < dist/image-references.txt

      - name: Sign release evidence
        run: |
          cosign sign-blob --yes \
            --bundle dist/release/buildsphere-release-manifest.json.bundle \
            dist/release/buildsphere-release-manifest.json
          cosign sign-blob --yes \
            --bundle dist/release/SHA256SUMS.bundle \
            dist/release/SHA256SUMS

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            release_state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            test "${release_state}" = "true"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "BuildSphere ${GITHUB_REF_NAME}" \
              --notes "Phase 14 multi-platform certified candidate for commit ${GITHUB_SHA}. Verify the signed manifest, checksums, image signatures, and staging behavior before publication."
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/release/buildsphere-${RELEASE_VERSION}.tgz" \
            dist/release/buildsphere-digest-values.yaml \
            dist/release/buildsphere-release-manifest.json \
            dist/release/buildsphere-release-manifest.json.bundle \
            dist/release/SHA256SUMS \
            dist/release/SHA256SUMS.bundle \
            dist/release/*.cdx.json \
            --clobber
