name: BuildSphere CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sources
        run: pnpm lint

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Verify production packaging
        run: pnpm verify:phase10

  container-builds:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api-gateway
            port: 8080
          - component: auth-service
            port: 8081
          - component: project-service
            port: 8082
          - component: pipeline-service
            port: 8083
          - component: deployment-service
            port: 8084
          - component: monitoring-service
            port: 8085
          - component: logging-service
            port: 8086
          - component: ai-service
            port: 8087
          - component: analytics-service
            port: 8088
          - component: notification-service
            port: 8089
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.component }} image without push
        run: >-
          docker build
          --file infrastructure/docker/Dockerfile.backend
          --build-arg SERVICE=${{ matrix.component }}
          --build-arg SERVICE_PORT=${{ matrix.port }}
          --tag buildsphere/${{ matrix.component }}:ci
          .

  frontend-container:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image without push
        run: >-
          docker build
          --file infrastructure/docker/Dockerfile.frontend
          --build-arg VITE_API_URL=/api
          --tag buildsphere/frontend:ci
          .
