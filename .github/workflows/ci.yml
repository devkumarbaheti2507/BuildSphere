name: BuildSphere CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sources
        run: pnpm lint

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Setup Prometheus rule validator
        env:
          PROMETHEUS_VERSION: 3.12.0
          PROMETHEUS_LINUX_AMD64_SHA256: 20da47f8e5303f74aecb78edd7f7e39041dac08ac4939dba75efd7a900ae8867
        run: |
          archive="/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            --output "${archive}"
          echo "${PROMETHEUS_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory /tmp
          echo "PROMTOOL_BIN=/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" >> "${GITHUB_ENV}"

      - name: Verify production packaging
        run: pnpm verify:phase10

      - name: Verify production observability
        run: pnpm verify:phase11

      - name: Verify runtime reliability and network security
        run: pnpm verify:phase12

      - name: Setup workflow validator
        run: |
          sh scripts/install-actionlint.sh "${RUNNER_TEMP}/actionlint"
          echo "ACTIONLINT_BIN=${RUNNER_TEMP}/actionlint/actionlint" >> "${GITHUB_ENV}"

      - name: Verify software supply-chain release certification
        run: pnpm verify:phase13

      - name: Verify personal free-tier deployment readiness
        run: pnpm verify:phase14

  container-builds:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api-gateway
            port: 8080
          - component: auth-service
            port: 8081
          - component: project-service
            port: 8082
          - component: pipeline-service
            port: 8083
          - component: deployment-service
            port: 8084
          - component: monitoring-service
            port: 8085
          - component: logging-service
            port: 8086
          - component: ai-service
            port: 8087
          - component: analytics-service
            port: 8088
          - component: notification-service
            port: 8089
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build ${{ matrix.component }} image without push
        run: >-
          docker build
          --file infrastructure/docker/Dockerfile.backend
          --build-arg SERVICE=${{ matrix.component }}
          --build-arg SERVICE_PORT=${{ matrix.port }}
          --tag buildsphere/${{ matrix.component }}:ci
          .

  frontend-container:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build frontend image without push
        run: >-
          docker build
          --file infrastructure/docker/Dockerfile.frontend
          --build-arg VITE_API_URL=/api
          --tag buildsphere/frontend:ci
          .

  arm64-container-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup QEMU for ARM64 builds
        uses: docker/setup-qemu-action@9430f61a7691bd1bfdc4d6ba70e558659d36fa7a # v4.1.0
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Cross-build representative ARM64 images without push
        run: bash scripts/verify-phase14-arm64-images.sh
