services:
  postgres:
    image: postgres:16-alpine
    container_name: buildsphere-postgres
    environment:
      POSTGRES_DB: buildsphere
      POSTGRES_USER: buildsphere
      POSTGRES_PASSWORD: buildsphere_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildsphere -d buildsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buildsphere-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: buildsphere-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buildsphere
      MINIO_ROOT_PASSWORD: buildsphere_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: buildsphere-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
