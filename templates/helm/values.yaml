replicaCount: {{replicas}}

image:
  repository: {{imageName}}
  pullPolicy: IfNotPresent
  tag: "{{imageTag}}"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: {{containerPort}}

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: {{host}}
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
