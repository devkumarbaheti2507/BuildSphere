apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{serviceName}}-ingress
  namespace: {{namespace}}
spec:
  rules:
    - host: {{host}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{serviceName}}
                port:
                  number: 80
