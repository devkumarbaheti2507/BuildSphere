name: Node Docker Kubernetes Terraform Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated project files
        run: |
          test -f .github/workflows/ci.yml
          if [[ -d kubernetes ]]; then
            test -f kubernetes/deployment.yaml
            test -f kubernetes/service.yaml
          fi
          if [[ -f helm/Chart.yaml ]]; then
            grep -Eq '^apiVersion: v2$' helm/Chart.yaml
            test -f helm/values.yaml
            test -f helm/templates/_helpers.tpl
            test -f helm/templates/deployment.yaml
            test -f helm/templates/service.yaml
            test -f helm/templates/ingress.yaml
            test -f helm/templates/NOTES.txt
          fi
          if [[ -d terraform ]]; then
            test -f terraform/versions.tf
            test -f terraform/providers.tf
            test -f terraform/variables.tf
            test -f terraform/main.tf
            test -f terraform/outputs.tf
            test -f terraform/terraform.tfvars.example
            test -f terraform/backend.tf.example
            test -f terraform/.gitignore
            test -f terraform/README.md
            grep -Eq '^\s*default\s*=\s*false$' terraform/variables.tf
          fi
      - name: Detect optional build inputs
        id: build_inputs
        run: |
          if [[ -f package.json ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f Dockerfile ]]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f terraform/versions.tf ]]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v4
        if: steps.build_inputs.outputs.terraform == 'true'
        with:
          terraform_version: 1.15.8
      - name: Check Terraform formatting
        if: steps.build_inputs.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Initialize Terraform without a backend
        if: steps.build_inputs.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform init -backend=false -input=false -no-color
      - name: Validate Terraform
        if: steps.build_inputs.outputs.terraform == 'true'
        working-directory: terraform
        run: terraform validate -no-color
      - uses: actions/setup-node@v4
        if: steps.build_inputs.outputs.node == 'true'
        with:
          node-version: 22
      - name: Enable Corepack
        if: steps.build_inputs.outputs.node == 'true'
        run: corepack enable
      - name: Install dependencies
        if: steps.build_inputs.outputs.node == 'true'
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Test Node project
        if: steps.build_inputs.outputs.node == 'true'
        run: pnpm run --if-present test
      - name: Build Node project
        if: steps.build_inputs.outputs.node == 'true'
        run: pnpm run --if-present build
      - name: Build Docker image
        if: steps.build_inputs.outputs.docker == 'true'
        run: docker build -t {{imageName}}:${{ github.sha }} .
