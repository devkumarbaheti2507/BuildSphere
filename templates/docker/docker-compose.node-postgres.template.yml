services:
  {{serviceName}}:
    build: .
    ports:
      - "{{containerPort}}:{{containerPort}}"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://{{dbUser}}:{{dbPassword}}@postgres:5432/{{dbName}}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: {{dbName}}
      POSTGRES_USER: {{dbUser}}
      POSTGRES_PASSWORD: {{dbPassword}}
    ports:
      - "5432:5432"
